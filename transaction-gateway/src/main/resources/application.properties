spring.application.name=transaction-gateway

server.port=8080
ledger.service.url=http://localhost:8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/swiftpay
spring.datasource.username=swiftpay
spring.datasource.password=swiftpay
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

